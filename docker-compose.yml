services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - server/.env
    environment:
      PORT: 3001
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
    ports:
      - "3001:3001"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: client
    depends_on:
      - server
    ports:
      - "5173:80"
    restart: unless-stopped
